<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тактический планшет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="room-input">
    <input type="text" id="room-id" placeholder="Название комнаты">
    <input type="text" id="user-name" placeholder="Ваше имя">
    <button id="join-btn">Войти в комнату</button>
  </div>

  <div id="canvas-container" style="display:none;">
    <div id="header">
      <span>Комната: <span id="room-id-display"></span></span>
      <select id="map-select"></select>
    </div>
    <div style="display:flex;">
      <div id="ships-panel">
        <!-- Панель с кораблями -->
      </div>
      <div style="position:relative;">
        <canvas id="canvas"></canvas>
        <!-- Таблица справа от карты -->
        <div id="radius-info" style="
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          right: -270px; /* 50px от правого края карты (600px + 50 = 650), ширина таблицы 220px */
          width: 220px;
          background: rgba(0, 0, 0, 0.7);
          color: white;
          padding: 10px;
          border-radius: 5px;
          font-size: 12px;
          z-index: 10;
          font-family: Arial, sans-serif;
        ">
          <h4 style="margin: 0 0 10px 0; color: yellow; font-size: 13px;">Радиус РЛС (км)</h4>
          <table id="radius-table" style="
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
          ">
            <thead>
              <tr>
                <th style="text-align: left; padding: 2px; color: yellow;">Корабль</th>
                <th style="text-align: left; padding: 2px; color: yellow;">Радиус</th>
              </tr>
            </thead>
            <tbody>
              <!-- Сгенерировано JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <ul id="users-list"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
