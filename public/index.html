<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тактический планшет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="room-input" class="login-screen">
    <input type="text" id="room-id" placeholder="Введите ID комнаты">
    <input type="text" id="user-name" placeholder="Введите ваше имя">
    <input type="password" id="room-password" placeholder="Пароль комнаты (необязательно)">
    <button id="join-btn">Войти в комнату</button>
  </div>

  <div id="canvas-container" style="display:none;">
    <a href="https://forum.korabli.su/topic/169209-%D1%81%D0%B5%D1%80%D0%B2%D0%B8%D1%81-%D1%82%D0%B0%D0%BA%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D0%BB%D0%B0%D0%BD%D1%88%D0%B5%D1%82/" class="forum-link">Тема на официальном форуме Мира Кораблей</a>

    <div class="workspace" id="canvas-container">
        
        <div id="info-panel">
	      <h3>Комната: <span id="room-id-display"></span></h3>
		<div>
		        <label>Карта: </label>
		     	<select id="map-select">
		     		<option value="Греция.png">Греция.png</option>
		 	</select>
		</div>
	 	<div>
		        <label for="tactic-select">Тактика:</label>
		        <select id="tactic-select">
	        		<option value="Тактика 1">Тактика 1</option>
	        	</select>
	        	<button id="new-tactic-btn">Новая тактика</button>
	        	<button id="delete-tactic-btn">Удалить текущую тактику</button>
	      	</div>
		<label>Список участников: </label>
		<ul id="users-list"></ul>
        </div>
	<canvas id="canvas" width="900" height="900"></canvas>
        <div id="ships-panel">
		<div id="trashcan" class="trashcan-zone">
			🗑️
			<div>
				Перетащите сюда иконки кораблей или векторов с карты для удаления
			</div>	
		</div>
		<h4>Иконки кораблей</h4>
		<div class="ships-grid">
 			<div class="ship-item" data-type="lk" data-color="red"><img src="ships/lk_red.svg" draggable="true" width="50" height="50"></div>
			<div class="ship-item" data-type="kr" data-color="red"><img src="ships/kr_red.svg" draggable="true" width="50" height="50"></div>
			<div class="ship-item" data-type="es" data-color="red"><img src="ships/es_red.svg" draggable="true" width="50" height="50"></div>
			<div class="ship-item" data-type="lk" data-color="green"><img src="ships/lk_green.svg" draggable="true" width="50" height="50"></div>
			<div class="ship-item" data-type="kr" data-color="green"><img src="ships/kr_green.svg" draggable="true" width="50" height="50"></div>
			<div class="ship-item" data-type="es" data-color="green"><img src="ships/es_green.svg" draggable="true" width="50" height="50"></div>
        	</div>
		<h4>Вектор</h4>
		<div class="vectors-grid">
			<div class="ship-item" data-type="vector-red"><img src="icons/vector-red.png" alt="Красный вектор" width="50" height="50"></div>
			<div class="ship-item" data-type="vector-green"><img src="icons/vector-green.png" alt="Зелёный вектор" width="50" height="50"></div>
		</div>
		<h4>Кастомные окружности</h4>
		<div id="circle-controls">
			<div>
				<span>Цвет</span>
				<label><input type="radio" name="circle-color" value="red" checked> 🔴</label>
				<label><input type="radio" name="circle-color" value="green"> 🟢</label>
				<label><input type="radio" name="circle-color" value="yellow"> 🟡</label>
			</div>
			<div>
				<div>Радиус, км</div>
				<input type="number" id="circle-radius-input" value="5.5" step="0.1" min="0.1" max="48" placeholder="Радиус (км)">
			</div>
			<button id="add-circle-btn">Добавить окружность</button>
			<button id="remove-all-circles-btn">Удалить все окружности с корабля</button>
        	</div>
        </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
