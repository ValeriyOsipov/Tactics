<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тактический планшет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="room-input">
    <input type="text" id="room-id" placeholder="Название комнаты">
    <input type="text" id="user-name" placeholder="Ваше имя">
    <button id="join-btn">Войти в комнату</button>
  </div>

  <div id="canvas-container" style="display:none;">
    <div id="header">
      <span>Комната: <span id="room-id-display"></span></span>
      <select id="map-select"></select>
    </div>
    <div style="display:flex;">
      <div id="ships-panel">
        <!-- Панель с кораблями -->
      </div>
      <div id="canvas-wrapper" style="position:relative;">
        <canvas id="canvas"></canvas>
        <!-- Таблица справа -->
        <div id="radius-info" style="
          position: absolute;
          top: 10px;
          right: 10px;
          background: rgba(0, 0, 0, 0.7);
          color: white;
          padding: 10px;
          border-radius: 5px;
          font-size: 12px;
          width: 200px;
          z-index: 10;
        ">
          <h4>Радиусы кораблей (км)</h4>
          <table id="radius-table">
            <!-- Сгенерировано JS -->
          </table>
        </div>
      </div>
    </div>
    <ul id="users-list"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
